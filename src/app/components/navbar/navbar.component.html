<!-- Main Header -->
<header class="header" [class.scrolled]="isScrolled()">
  <div class="container header-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="brand" (click)="closeMobileMenu()">
      <div class="brand-symbol">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="15" fill="#6B1D2F" />
          <path d="M10 11L16 23L22 11" stroke="#FAF5EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 11V18" stroke="#D49A3D" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="7" r="1.5" fill="#FAF5EF" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">WE CARE</span>
        <span class="brand-tagline">Startup Support Partner</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <ul class="nav-list">
        @for (item of navLinks; track item.path) {
          <li class="nav-item">
            <a [routerLink]="item.path" 
               routerLinkActive="active" 
               [routerLinkActiveOptions]="{ exact: item.path === '/' }"
               class="nav-link">
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <a routerLink="/contact" class="btn btn-primary btn-cta">
        <span>Get Support</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()" aria-label="Toggle navigation menu">
        <span class="bar" [class.open]="mobileMenuOpen()"></span>
        <span class="bar" [class.open]="mobileMenuOpen()"></span>
        <span class="bar" [class.open]="mobileMenuOpen()"></span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Drawer & Overlay -->
<div class="mobile-overlay" [class.show]="mobileMenuOpen()" (click)="closeMobileMenu()"></div>

<aside class="mobile-drawer" [class.open]="mobileMenuOpen()">
  <div class="drawer-header">
    <div class="brand">
      <div class="brand-symbol small">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="15" fill="#6B1D2F" />
          <path d="M10 11L16 23L22 11" stroke="#FAF5EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 11V18" stroke="#D49A3D" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">WE CARE</span>
    </div>
    <button class="close-btn" (click)="closeMobileMenu()" aria-label="Close menu">&times;</button>
  </div>

  <div class="drawer-body">
    <ul class="mobile-nav-list">
      @for (item of navLinks; track item.path) {
        <li>
          <a [routerLink]="item.path" 
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{ exact: item.path === '/' }"
             (click)="closeMobileMenu()" 
             class="mobile-nav-link">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="drawer-footer">
      <p class="drawer-quote">"Your idea matters. Let's build it with care."</p>
      <button class="btn btn-primary btn-block" (click)="navigateToContact()">
        Contact WE CARE
      </button>
    </div>
  </div>
</aside>
